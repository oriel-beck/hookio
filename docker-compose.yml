version: '3.9'

networks:
  hookio: {}

volumes:
  postgres_data: {}
  dragonfly_data: {}

services:
  # Main database. In-compose hostname: postgres
  postgres:
    image: postgres:16.15
    networks:
      - hookio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.postgres
    ports:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Rate limit and cache (Redis protocol). In-compose hostname: dragonfly
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.4
    networks:
      - hookio
    volumes:
      - dragonfly_data:/data
    ports:
      - 6379
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6379'"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Website (nginx). TLS: see client/nginx.tls.conf.example or an HTTPS tunnel for EventSub.
  client:
    build: client
    networks:
      - hookio
    depends_on:
      server:
        condition: service_healthy
    ports:
      - 80:80
      # Uncomment only when certs are mounted (do not publish 443 without TLS):
      # - 443:443
    env_file:
      - client/.env.production

  # Server (ASP.NET). In-compose hostname: server. Internal Kestrel port 8080 (nginx /api).
  server:
    build: server
    networks:
      - hookio
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - 8080
    env_file:
      - server/Hookio/.env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
