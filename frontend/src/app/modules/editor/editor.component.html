@if (store.loading()) {
<hookio-loading-overlay />
} @else if (store.error()) { } @else {
<div class="wrapper">
  <span class="toggle-editor-wrapper">
    <p-button
      [icon]="
        editorHidden() ? 'pi pi-angle-double-right' : 'pi pi-angle-double-left'
      "
      [text]="true"
      [outlined]="true"
      class="toggle-editor"
      (onClick)="editorHidden.set(!editorHidden())"
    ></p-button>
  </span>
  <hookio-editor-drawer
    [(hidden)]="editorHidden"
    [(accordionState)]="accordionState"
    [(activeTabIndex)]="activeTabIndex"
    [ready]="isReady()"
    [form]="store.form()!"
    [subscription]="store.subscription()!"
    [messages]="store.messages()"
    (addEmbed)="store.addEmbed($event.messageIdx)"
    (moveEmbed)="
      store.moveEmbed($event.messageIdx, $event.embedIdx, $event.direction)
    "
    (duplicateEmbed)="store.duplicateEmbed($event.messageIdx, $event.embedIdx)"
    (removeEmbed)="store.removeEmbed($event.messageIdx, $event.embedIdx)"
    (addEmbedField)="store.addEmbedField($event.messageIdx, $event.embedIdx)"
    (moveEmbedField)="
      store.moveEmbedField(
        $event.messageIdx,
        $event.embedIdx,
        $event.fieldIdx,
        $event.direction
      )
    "
    (duplicateEmbedField)="
      store.duplicateEmbedField(
        $event.messageIdx,
        $event.embedIdx,
        $event.fieldIdx
      )
    "
    (removeEmbedField)="
      store.removeEmbedField(
        $event.messageIdx,
        $event.embedIdx,
        $event.fieldIdx
      )
    "
  />

  <hookio-editor-preview
    [full]="editorHidden()"
    [subscription]="store.subscription()!"
    [message]="currentMessage()"
  />
</div>
}
