<div class="stats">
  <div>
    <p-card>
      <ng-template pTemplate="header">
        <i class="pi pi-list"></i>
        <span class="total">Total Subscriptions</span>
      </ng-template>
      <div>{{ totalSubscriptions() }}</div>
    </p-card>
  </div>
  <div>
    <p-card>
      <ng-template pTemplate="header">
        <i class="pi pi-youtube"></i>
        <span class="youtube">YouTube Subscriptions</span>
      </ng-template>
      <div>{{ youtubeSubscriptions() }}</div>
    </p-card>
  </div>
  <div>
    <p-card>
      <ng-template pTemplate="header">
        <i class="pi pi-twitch"></i>
        <span class="twitch">Twitch Notifications</span>
      </ng-template>
      <div>{{ twitchSubscriptions() }}</div>
    </p-card>
  </div>
</div>
<div class="recent-actions">
  <p-table [value]="recentActions()" [responsiveLayout]="'scroll'">
    <ng-template pTemplate="header">
      <tr>
        <th>Platform</th>
        <th>Source</th>
        <th>Action</th>
        <th>Timestamp</th>
        <th>Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-action>
      <tr>
        <td>
          <span class="platform">
            <i
              [class]="
                'pi ' +
                (action.platform === 'YouTube' ? 'pi-youtube' : 'pi-twitch')
              "
            ></i>
            <span [ngClass]="action.platform.toLowerCase()">
              {{ action.platform }}
            </span>
          </span>
        </td>
        <td>
            <a [routerLink]="'/servers/' + guildId() + '/' + ''">
                {{ action.source }}
            </a>
        </td>
        <td>{{ action.action }}</td>
        <td>{{ action.timestamp }}</td>
        <td>
          <p-badge
            [value]="action.status"
            [severity]="action.status === 'Success' ? 'success' : 'danger'"
          ></p-badge>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">No Recent actions found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
